<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PANTAINI CAFÉ POS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
:root{--bg:#f7f1ea;--card:#fffdf9;--ink:#372419;--brown:#603718;--soft:#eadbcb;--line:#ddc9b6;--muted:#8b7462}
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#fff,#eadacd)}.loginbox{width:min(430px,92vw);padding:36px;border-radius:28px;background:var(--card);box-shadow:0 25px 70px #58341722}.brand{font-family:Georgia,serif;font-size:52px;color:var(--brown);line-height:.9}.sub{letter-spacing:5px;color:var(--muted)}
input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin:6px 0 12px;background:#fff}.primary{background:var(--brown);color:#fff;border:0;border-radius:12px;padding:13px 16px;font-weight:bold;width:100%}.secondary{background:var(--soft);border:0;border-radius:12px;padding:12px}.msg{min-height:20px;color:#a22;font-size:13px}.small{font-size:12px}.muted{color:var(--muted)}
.app{display:flex;min-height:100vh}.side{width:245px;background:#432718;color:#fff8f1;padding:22px 14px;display:flex;flex-direction:column;gap:10px}.side .brand{color:#fff8f1;font-size:40px;text-align:center;margin:15px 0}.nav button{width:100%;border:0;background:transparent;color:#f9eade;text-align:left;padding:13px;border-radius:12px}.nav button.active,.nav button:hover{background:#67422d}.logout{margin-top:auto;background:#67422d!important}.main{flex:1;padding:26px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h1{margin:0;font-size:28px}.badge{padding:9px 13px;border-radius:999px;background:#efe2d5;color:var(--brown);font-weight:bold}
.view{display:none}.view.active{display:block}.pos{display:grid;grid-template-columns:1fr 390px;gap:20px}.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.cats button{border:1px solid var(--line);background:var(--card);color:var(--brown);padding:9px 14px;border-radius:999px;font-weight:bold}.cats button.active{background:var(--brown);color:#fff}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:13px}.product{background:var(--card);border:1px solid #eadacd;border-radius:20px;padding:16px;transition:.15s;text-align:left}.product:hover{transform:translateY(-2px);box-shadow:0 10px 25px #5b36151a}.product h3{margin:10px 0 5px;font-size:16px}.price{font-weight:bold;color:var(--brown)}
.panel,.cart,.stat{background:var(--card);border:1px solid #eadacd;border-radius:20px}.cart{padding:18px;height:fit-content;position:sticky;top:18px}.cartItems{max-height:390px;overflow:auto}.cartItem{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-bottom:1px dashed var(--line)}.qty button{border:0;background:var(--soft);width:27px;height:27px;border-radius:7px}.qty span{display:inline-block;width:28px;text-align:center}.total{display:flex;justify-content:space-between;padding:16px 0;font-size:23px;font-weight:bold}.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pay button{border:0;padding:11px;border-radius:11px;background:var(--soft)}.pay button.active{background:var(--brown);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:18px}.stat b{display:block;font-size:25px;color:var(--brown);margin-top:8px}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}.panel{padding:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #eadacd;text-align:left;vertical-align:top}.barrow{display:grid;grid-template-columns:110px 1fr 55px;gap:10px;align-items:center;margin:10px 0}.track{height:10px;background:var(--soft);border-radius:9px;overflow:hidden}.fill{height:100%;background:var(--brown)}.menuRow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eadacd}.empty{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;background:#342116;color:#fff;padding:13px 17px;border-radius:12px;display:none;z-index:100}
@media(max-width:900px){.side{width:68px;padding:10px}.side .brand,.nav button span{display:none}.nav button{text-align:center;font-size:20px}.pos{grid-template-columns:1fr}.cart{position:static}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.main{padding:15px}.products{grid-template-columns:repeat(2,1fr)}.stats,.grid2{grid-template-columns:1fr}.top{align-items:flex-start}.table{font-size:12px}}
</style></head><body>
<div id="setup" class="login"><div class="loginbox"><div class="brand">Pantaini</div><p class="sub">CAFÉ POS</p><p><b>กำลังตรวจสอบการตั้งค่า...</b></p></div></div>
<div id="login" class="login hidden"><div class="loginbox"><div class="brand">Pantaini</div><p class="sub">CAFÉ POS</p><input id="email" type="email" placeholder="อีเมล"><input id="password" type="password" placeholder="รหัสผ่าน"><button id="loginBtn" class="primary">เข้าสู่ระบบ</button><p id="loginMsg" class="msg"></p></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">Pantaini</div><div class="nav"><button class="active" data-view="pos">🛒 <span>POS ขายสินค้า</span></button><button data-view="dashboard">📊 <span>Dashboard</span></button><button data-view="orders">📋 <span>รายการขาย</span></button><button id="menuNav" data-view="menu">🍵 <span>จัดการเมนู</span></button></div><button id="logoutBtn" class="nav logout">🚪 <span>ออกจากระบบ</span></button></aside>
<main class="main"><div class="top"><div><h1 id="title">POS ขายสินค้า</h1><p id="date" class="muted"></p></div><div class="badge">🟢 ออนไลน์ <span id="userName"></span></div></div>
<section id="pos" class="view active"><div class="pos"><div><div id="cats" class="cats"></div><div id="products" class="products"></div></div><div class="cart"><h2 style="margin-top:0">🧾 ออเดอร์ปัจจุบัน</h2><div id="cartItems" class="cartItems"></div><div class="total"><span>รวม</span><span id="total">฿0</span></div><div class="pay"><button id="cashBtn" class="active">💵 เงินสด</button><button id="qrBtn">📱 QR / โอน</button></div><div id="cashBox"><input id="received" type="number" min="0" placeholder="รับเงินมา"><div class="small">เงินทอน: <b id="change">฿0</b></div></div><button id="checkoutBtn" class="primary" style="margin-top:12px">✓ ชำระเงิน</button></div></div></section>
<section id="dashboard" class="view"><div id="stats" class="stats"></div><div class="grid2"><div class="panel"><h2>🔥 เมนูขายดี</h2><div id="best"></div></div><div class="panel"><h2>📡 ข้อมูลหลายเครื่อง</h2><p class="muted">ข้อมูลถูกเก็บบน Supabase Database</p><button id="refreshBtn" class="secondary">↻ รีเฟรชข้อมูล</button></div></div></section>
<section id="orders" class="view"><div class="panel"><h2>ประวัติการขาย</h2><table class="table"><thead><tr><th>#</th><th>เวลา</th><th>รายการ</th><th>ชำระ</th><th>รวม</th></tr></thead><tbody id="orderRows"></tbody></table></div></section>
<section id="menu" class="view"><div class="grid2"><div class="panel"><h2>เพิ่มเมนู</h2><input id="mname" placeholder="ชื่อเมนู"><input id="mprice" type="number" min="0" placeholder="ราคา"><select id="mcat"><option>COFFEE</option><option>MATCHA</option><option>TEA</option><option>MILK</option><option>SODA</option><option>APPETIZERS</option></select><button id="addMenuBtn" class="primary">+ เพิ่มเมนู</button></div><div class="panel"><h2>เมนูทั้งหมด</h2><div id="menuList"></div></div></div></section>
</main></div><div id="toast" class="toast"></div>
<script>
let sb=null,profile=null,products=[],cart=[],orders=[],activeCat='',payMethod='cash';
const icon={COFFEE:'☕',MATCHA:'🍵',TEA:'🫖',MILK:'🥛',SODA:'🥤',APPETIZERS:'🍟'};
const titles={pos:'POS ขายสินค้า',dashboard:'Dashboard',orders:'รายการขาย',menu:'จัดการเมนู'};
const $=id=>document.getElementById(id);
const baht=n=>'฿'+Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>e.style.display='none',2800)}
function configured(){return typeof window.PANTAINI_SUPABASE_URL==='string'&&window.PANTAINI_SUPABASE_URL.startsWith('https://')&&typeof window.PANTAINI_SUPABASE_ANON_KEY==='string'&&window.PANTAINI_SUPABASE_ANON_KEY.length>10}
async function boot(){if(!configured()){ $('setup').innerHTML='<div class="loginbox"><div class="brand">Pantaini</div><p class="sub">CAFÉ POS</p><p><b>ตั้งค่า Supabase ก่อนใช้งาน</b></p><p class="muted">ตรวจสอบ config.js</p></div>';return}sb=window.supabase.createClient(window.PANTAINI_SUPABASE_URL,window.PANTAINI_SUPABASE_ANON_KEY);$('setup').classList.add('hidden');const {data:{session}}=await sb.auth.getSession();if(session)await openApp(session.user);else $('login').classList.remove('hidden');sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')location.reload()})}
async function signIn(){const msg=$('loginMsg');msg.textContent='กำลังเข้าสู่ระบบ...';const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg.textContent=error.message;return}await openApp(data.user)}
async function signOut(){await sb.auth.signOut()}
async function openApp(user){const {data,error}=await sb.from('profiles').select('*').eq('id',user.id).single();if(error){$('loginMsg').textContent='ไม่พบ Profile: '+error.message;$('login').classList.remove('hidden');return}profile=data;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userName').textContent='• '+(profile.full_name||user.email);$('menuNav').classList.toggle('hidden',profile.role!=='admin');$('date').textContent=new Date().toLocaleDateString('th-TH',{weekday:'long',year:'numeric',month:'long',day:'numeric'});bindUI();await refreshAll();subscribeRealtime()}
function bindUI(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>showView(b.dataset.view,b));$('loginBtn').onclick=signIn;$('logoutBtn').onclick=signOut;$('cashBtn').onclick=()=>setPay('cash');$('qrBtn').onclick=()=>setPay('qr');$('checkoutBtn').onclick=checkout;$('refreshBtn').onclick=refreshAll;$('addMenuBtn').onclick=addProduct;$('received').oninput=updateChange}
function showView(id,b){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('[data-view]').forEach(v=>v.classList.remove('active'));if(b)b.classList.add('active');$('title').textContent=titles[id];if(id==='dashboard')renderDashboard();if(id==='orders')renderOrders();if(id==='menu')renderMenuAdmin()}
async function refreshAll(){await loadProducts();await loadOrders();renderPOS();renderCart();renderDashboard();renderOrders();if(profile?.role==='admin')renderMenuAdmin()}
async function loadProducts(){const {data,error}=await sb.from('products').select('*').eq('active',true).order('category').order('name');if(error){products=[];toast('โหลดเมนูไม่ได้: '+error.message)}else products=data||[]}
async function loadOrders(){let q=sb.from('orders').select('*, order_items(*)').order('created_at',{ascending:false}).limit(200);if(profile?.role==='staff')q=q.eq('cashier_id',profile.id);const {data,error}=await q;if(error){orders=[];console.error(error);toast('โหลดรายการขายไม่ได้: '+error.message)}else orders=(data||[]).filter(o=>!o.status||o.status==='paid')}
function renderPOS(){const cats=[...new Set(products.map(p=>String(p.category||'').trim()).filter(Boolean))];if(!cats.length){$('cats').innerHTML='';$('products').innerHTML='<div class="empty">ยังไม่มีเมนูในระบบ</div>';return}if(!activeCat||!cats.includes(activeCat))activeCat=cats[0];$('cats').innerHTML='';cats.forEach(cat=>{const b=document.createElement('button');b.type='button';b.className=cat===activeCat?'active':'';b.textContent=(icon[cat]||'🍽️')+' '+cat;b.onclick=()=>{activeCat=cat;renderPOS()};$('cats').appendChild(b)});const visible=products.filter(p=>String(p.category)===String(activeCat));const el=$('products');el.innerHTML='';visible.forEach(product=>{const card=document.createElement('button');card.type='button';card.className='product';card.innerHTML='<div style="font-size:28px">'+(icon[product.category]||'🍽️')+'</div><h3>'+esc(product.name)+'</h3><div class="price">'+baht(product.price)+'</div>';card.addEventListener('click',()=>addCart(product));el.appendChild(card)})}
function addCart(product){if(!product||product.id===undefined){toast('ไม่พบข้อมูลสินค้า');return}const existing=cart.find(x=>String(x.id)===String(product.id));if(existing)existing.qty+=1;else cart.push({id:product.id,name:product.name,price:Number(product.price||0),category:product.category,qty:1});renderCart();toast('เพิ่ม '+product.name+' แล้ว')}
function changeQty(id,n){const x=cart.find(x=>String(x.id)===String(id));if(!x)return;x.qty+=n;if(x.qty<=0)cart=cart.filter(x=>String(x.id)!==String(id));renderCart()}
function cartTotal(){return cart.reduce((s,x)=>s+Number(x.price)*Number(x.qty),0)}
function renderCart(){const el=$('cartItems');if(!cart.length)el.innerHTML='<div class="empty">ยังไม่มีรายการ</div>';else{el.innerHTML='';cart.forEach(item=>{const row=document.createElement('div');row.className='cartItem';const left=document.createElement('div');left.innerHTML='<b>'+esc(item.name)+'</b><div class="small">'+baht(item.price)+' × '+item.qty+'</div>';const right=document.createElement('div');const sum=document.createElement('b');sum.textContent=baht(item.price*item.qty);const q=document.createElement('div');q.className='qty';const minus=document.createElement('button');minus.textContent='−';minus.onclick=()=>changeQty(item.id,-1);const count=document.createElement('span');count.textContent=item.qty;const plus=document.createElement('button');plus.textContent='+';plus.onclick=()=>changeQty(item.id,1);q.append(minus,count,plus);right.append(sum,q);row.append(left,right);el.appendChild(row)})}$('total').textContent=baht(cartTotal());updateChange()}
function setPay(m){payMethod=m;$('cashBtn').classList.toggle('active',m==='cash');$('qrBtn').classList.toggle('active',m==='qr');$('cashBox').classList.toggle('hidden',m!=='cash');updateChange()}
function updateChange(){const r=Number($('received').value||0);$('change').textContent=baht(Math.max(0,r-cartTotal()))}
async function checkout(){if(!cart.length){toast('กรุณาเลือกสินค้า');return}const total=cartTotal();let received=null,changeAmount=0;if(payMethod==='cash'){received=Number($('received').value||0);if(received<total){toast('จำนวนเงินที่รับไม่พอ');return}changeAmount=received-total}let payload={cashier_id:profile.id,payment_method:payMethod,total,received,change_amount:changeAmount,status:'paid'};let {data:order,error}=await sb.from('orders').insert(payload).select().single();if(error&&String(error.message).includes('status')){delete payload.status;({data:order,error}=await sb.from('orders').insert(payload).select().single())}if(error){toast('บันทึกออเดอร์ไม่ได้: '+error.message);return}const items=cart.map(x=>({order_id:order.id,product_id:x.id,product_name:x.name,unit_price:x.price,quantity:x.qty}));const {error:itemError}=await sb.from('order_items').insert(items);if(itemError){toast('บันทึกรายการสินค้าไม่ได้: '+itemError.message);return}toast('ชำระเงินสำเร็จ '+baht(total)+(payMethod==='cash'?' • ทอน '+baht(changeAmount):''));cart=[];$('received').value='';await refreshAll()}
function renderDashboard(){const now=new Date();const today=orders.filter(o=>{const d=new Date(o.created_at);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate()});const todaySales=today.reduce((s,o)=>s+Number(o.total||0),0);const month=orders.filter(o=>{const d=new Date(o.created_at);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()});const monthSales=month.reduce((s,o)=>s+Number(o.total||0),0);$('stats').innerHTML='<div class="stat">💰 ยอดขายวันนี้<b>'+baht(todaySales)+'</b></div><div class="stat">🧾 ออเดอร์วันนี้<b>'+today.length+'</b></div><div class="stat">📅 ยอดขายเดือนนี้<b>'+baht(monthSales)+'</b></div><div class="stat">☕ เมนูทั้งหมด<b>'+products.length+'</b></div>';const count={};orders.forEach(o=>(o.order_items||[]).forEach(i=>count[i.product_name]=(count[i.product_name]||0)+Number(i.quantity||0)));const arr=Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,7),max=arr[0]?.[1]||1;$('best').innerHTML=arr.length?arr.map(([n,q])=>'<div class="barrow"><span>'+esc(n)+'</span><div class="track"><div class="fill" style="width:'+(q/max*100)+'%"></div></div><b>'+q+'</b></div>').join(''):'<div class="empty">ยังไม่มีข้อมูลการขาย</div>'}
function renderOrders(){$('orderRows').innerHTML=orders.length?orders.map(o=>'<tr><td>#'+esc(o.order_no||o.id||'')+'</td><td>'+new Date(o.created_at).toLocaleString('th-TH')+'</td><td>'+(o.order_items||[]).map(i=>esc(i.product_name)+' ×'+i.quantity).join('<br>')+'</td><td>'+(o.payment_method==='cash'?'💵 เงินสด':'📱 QR')+'</td><td><b>'+baht(o.total)+'</b></td></tr>').join(''):'<tr><td colspan="5" class="empty">ยังไม่มีรายการขาย</td></tr>'}
function renderMenuAdmin(){if(profile?.role!=='admin')return;const el=$('menuList');el.innerHTML='';products.forEach(p=>{const row=document.createElement('div');row.className='menuRow';row.innerHTML='<div><b>'+esc(p.name)+'</b><div class="small muted">'+esc(p.category)+'</div></div>';const right=document.createElement('div');const price=document.createElement('b');price.textContent=baht(p.price);const del=document.createElement('button');del.textContent=' 🗑️';del.style.border='0';del.style.background='none';del.onclick=()=>deleteProduct(p.id);right.append(price,del);row.appendChild(right);el.appendChild(row)})}
async function addProduct(){if(profile?.role!=='admin'){toast('เฉพาะ Admin เท่านั้น');return}const name=$('mname').value.trim(),price=Number($('mprice').value),category=$('mcat').value;if(!name||Number.isNaN(price)||price<0){toast('กรอกชื่อและราคาให้ถูกต้อง');return}const {error}=await sb.from('products').insert({name,price,category,active:true});if(error){toast(error.message);return}$('mname').value='';$('mprice').value='';toast('เพิ่มเมนูแล้ว');await loadProducts();renderPOS();renderMenuAdmin()}
async function deleteProduct(id){if(!confirm('ลบเมนูนี้?'))return;const {error}=await sb.from('products').update({active:false}).eq('id',id);if(error){toast(error.message);return}await loadProducts();renderPOS();renderMenuAdmin()}
function subscribeRealtime(){if(!sb)return;sb.channel('pantaini-pos-live').on('postgres_changes',{event:'*',schema:'public',table:'products'},async()=>{await loadProducts();renderPOS();if(profile?.role==='admin')renderMenuAdmin()}).on('postgres_changes',{event:'*',schema:'public',table:'orders'},async()=>{await loadOrders();renderDashboard();renderOrders()}).subscribe()}
boot();
</script></body></html>
